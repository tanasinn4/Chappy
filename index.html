<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>MP3＆AI発話 口パクプレイヤー</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #111;
      color: #fff;
      font-family: sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    #screen {
      position: fixed;
      inset: 0;
      background: #111 url("background.jpg") center center / contain no-repeat;
    }

    #character {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }

    #character img {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
    }

    .face {
      font-size: 120px;
      line-height: 1;
      color: #fff;
    }

    /* 左：前へ / 中央・右：次へ */
    #left, #center, #right {
      position: fixed;
      top: 0;
      bottom: 0;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
    }
    #left { left: 0; width: 33.3333%; }
    #center { left: 33.3333%; width: 33.3334%; }
    #right { right: 0; width: 33.3333%; }

    /* Androidステータスバーとの被りを避けるため下に配置 */
    #toggleSettingsBtn {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 44px);
      right: 14px;
      z-index: 20;
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      background: rgba(32, 37, 43, 0.92);
      color: #9de5a5;
      font-size: 14px;
      cursor: pointer;
    }

    #settingsPanel {
      display: none;
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 92px);
      right: 14px;
      z-index: 20;
      width: min(340px, calc(100vw - 28px));
      max-height: calc(100vh - env(safe-area-inset-top, 0px) - 110px);
      overflow-y: auto;
      padding: 16px;
      box-sizing: border-box;
      background: #303840;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    #settingsPanel.open {
      display: block;
    }

    #settingsPanel p {
      margin: 8px 0 4px;
      font-size: 14px;
    }

    #status {
      font-size: 15px;
      color: #9de5a5;
      margin: 8px 0;
    }

    .panel-btn {
      padding: 8px 14px;
      margin: 4px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      background: #65b875;
      color: #fff;
      cursor: pointer;
    }

    .panel-btn.sub {
      background: #475569;
    }

    hr {
      border: none;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      margin: 12px 0;
    }

    input[type=file] {
      width: 100%;
      font-size: 12px;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <main id="screen" aria-label="口パクプレイヤー">
    <div id="left"></div>
    <div id="center"></div>
    <div id="right"></div>
  </main>

  <div id="character">
    <div class="face" id="face">😐</div>
  </div>

  <button type="button" id="toggleSettingsBtn">設定</button>

  <aside id="settingsPanel" aria-label="表示・テスト設定">
    <div id="status">待機中</div>

    <p>AI発話イベントテスト</p>
    <div>
      <button type="button" class="panel-btn" id="simStartBtn">buffer.started</button>
      <button type="button" class="panel-btn sub" id="simStopBtn">buffer.stopped</button>
    </div>

    <hr>

    <p>口を閉じた画像</p>
    <input type="file" id="closedFile" accept="image/*">

    <p>口を開いた画像</p>
    <input type="file" id="openFile" accept="image/*">
  </aside>

  <script>
    // ==========================================
    // 1. MP3音声ファイル設定（audio フォルダに配置）
    // ==========================================
    const speeches = [
      "audio/01_opening.mp3",
      "audio/02_kanpai.mp3",
      "audio/03_toast.mp3"
    ];

    // 初期画像パス（使わない場合は null のままでOK）
    const DEFAULT_CLOSED_IMAGE = null; // 例: "images/closed.png"
    const DEFAULT_OPEN_IMAGE = null;   // 例: "images/open.png"

    // 口パクの開閉周期（ミリ秒）
    const MOUTH_INTERVAL_MS = 140;

    let current = 0;
    const player = new Audio();
    player.preload = "auto";
    let wakeLock = null;

    let isMp3Playing = false;
    let isAiSpeaking = false;
    let mouthOpen = false;
    let mouthTimer = null;

    let closedImage = null;
    let openImage = null;

    const face = document.getElementById("face");
    const statusEl = document.getElementById("status");
    const settingsPanel = document.getElementById("settingsPanel");

    function updateFace() {
      const shouldShowOpen = (isMp3Playing || isAiSpeaking) && mouthOpen;
      if (closedImage && openImage) {
        const targetImg = shouldShowOpen ? openImage : closedImage;
        if (face.firstChild !== targetImg) {
          face.innerHTML = "";
          face.appendChild(targetImg);
        }
      } else {
        face.textContent = shouldShowOpen ? "😮" : "😐";
      }
    }

    function updateStatus() {
      if (isAiSpeaking && isMp3Playing) {
        statusEl.textContent = "AI発話中 + MP3再生中";
      } else if (isAiSpeaking) {
        statusEl.textContent = "AI発話中（buffer.started）";
      } else if (isMp3Playing) {
        statusEl.textContent = `MP3再生中 (${current + 1}/${speeches.length})`;
      } else {
        statusEl.textContent = "待機中";
      }
    }

    function syncMouthLoop() {
      const active = isMp3Playing || isAiSpeaking;
      if (active && !mouthTimer) {
        mouthOpen = true;
        updateFace();
        mouthTimer = setInterval(() => {
          mouthOpen = !mouthOpen;
          updateFace();
        }, MOUTH_INTERVAL_MS);
      } else if (!active && mouthTimer) {
        clearInterval(mouthTimer);
        mouthTimer = null;
        mouthOpen = false;
        updateFace();
      }
      updateStatus();
    }

    // ==========================================
    // 2. データチャネル / 外部イベント連携
    // ==========================================
    function setAiSpeaking(speaking) {
      isAiSpeaking = Boolean(speaking);
      syncMouthLoop();
    }

    window.handleRealtimeEvent = function(rawEvent) {
      let evt = rawEvent;
      if (typeof rawEvent === "string") {
        try {
          evt = JSON.parse(rawEvent);
        } catch (_) {
          return;
        }
      }
      if (!evt || typeof evt.type !== "string") return;

      if (evt.type === "output_audio_buffer.started") {
        setAiSpeaking(true);
      } else if (
        evt.type === "output_audio_buffer.stopped" ||
        evt.type === "output_audio_buffer.cleared" ||
        evt.type === "response.done"
      ) {
        setAiSpeaking(false);
      }
    };

    window.addEventListener("message", event => {
      window.handleRealtimeEvent(event.data);
    });

    // ==========================================
    // 3. MP3再生・画面タップ操作
    // ==========================================
    async function requestWakeLock() {
      try {
        if ("wakeLock" in navigator && !wakeLock) {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeLock.addEventListener("release", () => { wakeLock = null; });
        }
      } catch (_) {}
    }

    function playTrack(index) {
      if (!speeches.length) return;
      current = ((index % speeches.length) + speeches.length) % speeches.length;
      player.pause();
      player.src = speeches[current];
      player.currentTime = 0;
      player.play().catch(() => {});
      requestWakeLock();
    }

    function handleScreenTapNext() {
      if (!speeches.length) return;
      if (!player.src) {
        playTrack(0);
      } else {
        playTrack(current + 1);
      }
    }

    player.addEventListener("play", () => {
      isMp3Playing = true;
      syncMouthLoop();
    });
    player.addEventListener("pause", () => {
      isMp3Playing = false;
      syncMouthLoop();
    });
    player.addEventListener("ended", () => {
      isMp3Playing = false;
      syncMouthLoop();
    });

    document.getElementById("left").addEventListener("click", () => {
      if (speeches.length) playTrack(current - 1);
    });
    document.getElementById("center").addEventListener("click", handleScreenTapNext);
    document.getElementById("right").addEventListener("click", handleScreenTapNext);

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && isMp3Playing) {
        requestWakeLock();
      }
    });

    document.addEventListener("contextmenu", event => {
      if (!event.target.closest("#settingsPanel")) event.preventDefault();
    });
    document.addEventListener("gesturestart", event => event.preventDefault());

    // ==========================================
    // 4. 設定パネル・画像切替・テストボタン
    // ==========================================
    document.getElementById("toggleSettingsBtn").addEventListener("click", e => {
      e.stopPropagation();
      settingsPanel.classList.toggle("open");
    });

    settingsPanel.addEventListener("click", e => e.stopPropagation());

    document.getElementById("simStartBtn").addEventListener("click", () => {
      window.handleRealtimeEvent({ type: "output_audio_buffer.started" });
    });
    document.getElementById("simStopBtn").addEventListener("click", () => {
      window.handleRealtimeEvent({ type: "output_audio_buffer.stopped" });
    });

    function createImageElement(src, onLoaded) {
      const img = new Image();
      img.onload = () => onLoaded(img);
      img.src = src;
    }

    if (DEFAULT_CLOSED_IMAGE) {
      createImageElement(DEFAULT_CLOSED_IMAGE, img => {
        closedImage = img;
        updateFace();
      });
    }
    if (DEFAULT_OPEN_IMAGE) {
      createImageElement(DEFAULT_OPEN_IMAGE, img => {
        openImage = img;
        updateFace();
      });
    }

    function bindFileInput(inputId, onReady) {
      document.getElementById(inputId).addEventListener("change", e => {
        const file = e.target.files[0];
        if (!file) return;

        const url = URL.createObjectURL(file);
        createImageElement(url, img => {
          onReady(img);
          URL.revokeObjectURL(url);
        });
      });
    }

    bindFileInput("closedFile", img => {
      closedImage = img;
      updateFace();
    });

    bindFileInput("openFile", img => {
      openImage = img;
      updateFace();
    });

    updateFace();
    updateStatus();
  </script>
</body>
</html>
