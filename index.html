<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>音声プレイヤー＆口パク連動</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    #screen {
      position: fixed;
      inset: 0;
      background: #000 url("background.jpg") center center / contain no-repeat;
    }

    /* キャラクター表示エリア */
    #character {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 1;
    }

    #character img {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
    }

    .face {
      font-size: clamp(96px, 24vw, 180px);
      line-height: 1;
      transition: transform 0.08s;
    }

    /* 左・中央・右のタップ領域 */
    #left, #center, #right {
      position: absolute;
      top: 0;
      bottom: 0;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
    }
    #left { left: 0; width: 33.3333%; }
    #center { left: 33.3333%; width: 33.3334%; }
    #right { right: 0; width: 33.3333%; }

    /* 設定開閉ボタンとパネル */
    #toggleSettingsBtn {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 10;
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      background: rgba(32, 37, 43, 0.85);
      color: #9de5a5;
      font-size: 14px;
      cursor: pointer;
    }

    #settingsPanel {
      display: none;
      position: fixed;
      top: 54px;
      right: 12px;
      z-index: 10;
      width: min(340px, calc(100vw - 24px));
      max-height: calc(100vh - 70px);
      overflow-y: auto;
      padding: 16px;
      box-sizing: border-box;
      background: rgba(48, 56, 64, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    #settingsPanel.open {
      display: block;
    }

    #settingsPanel p {
      margin: 8px 0 4px;
      font-size: 14px;
    }

    #status {
      font-size: 15px;
      color: #9de5a5;
      margin: 8px 0;
    }

    .meter {
      width: 100%;
      height: 14px;
      margin: 8px 0 12px;
      background: #22282e;
      border-radius: 8px;
      overflow: hidden;
    }

    #bar {
      height: 100%;
      width: 0%;
      background: #75d98b;
      transition: width 0.05s;
    }

    input[type=range] {
      width: 100%;
      cursor: pointer;
    }

    .panel-btn {
      padding: 8px 16px;
      margin: 6px 4px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      background: #65b875;
      color: #fff;
      cursor: pointer;
    }

    .panel-btn.stop {
      background: #7a8590;
    }

    hr {
      border: none;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      margin: 12px 0;
    }

    input[type=file] {
      width: 100%;
      font-size: 12px;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <main id="screen" aria-label="音声プレイヤー">
    <div id="character">
      <div class="face" id="face">😐</div>
    </div>

    <div id="left"></div>
    <div id="center"></div>
    <div id="right"></div>
  </main>

  <button type="button" id="toggleSettingsBtn">マイク設定</button>

  <aside id="settingsPanel" aria-label="マイク・口パク設定">
    <div id="status">停止中</div>

    <div class="meter">
      <div id="bar"></div>
    </div>

    <p>音量の反応閾値: <span id="thresholdValue">8</span></p>
    <input type="range" id="threshold" min="1" max="30" value="8">

    <div>
      <button type="button" class="panel-btn" id="startMicBtn">マイク開始</button>
      <button type="button" class="panel-btn stop" id="stopMicBtn">停止</button>
    </div>

    <hr>

    <p>口を閉じた画像</p>
    <input type="file" id="closedFile" accept="image/*">

    <p>口を開いた画像</p>
    <input type="file" id="openFile" accept="image/*">
  </aside>

  <script>
    // ==========================================
    // 1. MP3音声ファイル設定（audio フォルダに配置）
    // ==========================================
    const speeches = [
      "audio/01_opening.mp3",
      "audio/02_kanpai.mp3",
      "audio/03_toast.mp3"
    ];

    // 初期画像パス（使わない場合は null のままでOK）
    const DEFAULT_CLOSED_IMAGE = null; // 例: "images/closed.png"
    const DEFAULT_OPEN_IMAGE = null;   // 例: "images/open.png"

    let current = 0;
    const player = new Audio();
    player.preload = "auto";
    let wakeLock = null;

    let audioContext = null;
    let analyser = null;
    let microphone = null;
    let stream = null;
    let animationId = null;
    let mp3MouthTimer = null;

    let closedImage = null;
    let openImage = null;

    let isTalking = false;
    let isMicTalking = false;
    let isMp3MouthOpen = false;
    let lastSoundTime = 0;

    const face = document.getElementById("face");
    const statusEl = document.getElementById("status");
    const bar = document.getElementById("bar");
    const threshold = document.getElementById("threshold");
    const thresholdValue = document.getElementById("thresholdValue");
    const settingsPanel = document.getElementById("settingsPanel");

    function refreshMouthState() {
      const isMp3Playing = !player.paused && !player.ended && player.readyState > 2;
      isTalking = isMicTalking || (isMp3Playing && isMp3MouthOpen);
      updateFace();
      if (stream || animationId) {
        statusEl.textContent = isTalking ? "おしゃべり中！" : "待機中";
      } else if (isMp3Playing) {
        statusEl.textContent = "MP3再生中";
      } else {
        statusEl.textContent = "停止中";
      }
    }

    function startMp3MouthLoop() {
      if (mp3MouthTimer) return;
      mp3MouthTimer = setInterval(() => {
        if (!player.paused && !player.ended) {
          isMp3MouthOpen = !isMp3MouthOpen;
        } else {
          isMp3MouthOpen = false;
        }
        refreshMouthState();
      }, 140);
    }

    player.addEventListener("play", () => {
      startMp3MouthLoop();
      refreshMouthState();
    });
    player.addEventListener("pause", () => {
      isMp3MouthOpen = false;
      refreshMouthState();
    });
    player.addEventListener("ended", () => {
      isMp3MouthOpen = false;
      refreshMouthState();
    });

    function loadAndPlay(index) {
      if (speeches.length === 0) return;
      current = Math.max(0, Math.min(index, speeches.length - 1));
      player.pause();
      player.src = speeches[current];
      player.currentTime = 0;
      player.play().catch(() => {});
      requestWakeLock();
    }

    function togglePlayback() {
      if (!speeches.length) return;
      if (!player.src) {
        loadAndPlay(current);
      } else if (player.paused) {
        player.play().catch(() => {});
        requestWakeLock();
      } else {
        player.pause();
      }
    }

    async function requestWakeLock() {
      try {
        if ("wakeLock" in navigator && !wakeLock) {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeLock.addEventListener("release", () => { wakeLock = null; });
        }
      } catch (_) {}
    }

    document.getElementById("left").addEventListener("click", () => {
      if (current > 0) loadAndPlay(current - 1);
    });
    document.getElementById("center").addEventListener("click", togglePlayback);
    document.getElementById("right").addEventListener("click", () => {
      if (current < speeches.length - 1) loadAndPlay(current + 1);
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && !player.paused) requestWakeLock();
    });

    document.addEventListener("contextmenu", event => {
      if (!event.target.closest("#settingsPanel")) event.preventDefault();
    });
    document.addEventListener("gesturestart", event => event.preventDefault());

    // ==========================================
    // 2. 設定パネル・画像切替・マイク制御
    // ==========================================
    document.getElementById("toggleSettingsBtn").addEventListener("click", e => {
      e.stopPropagation();
      settingsPanel.classList.toggle("open");
    });

    settingsPanel.addEventListener("click", e => e.stopPropagation());

    function createImageElement(src, onLoaded) {
      const img = new Image();
      img.onload = () => onLoaded(img);
      img.src = src;
    }

    if (DEFAULT_CLOSED_IMAGE) {
      createImageElement(DEFAULT_CLOSED_IMAGE, img => {
        closedImage = img;
        updateFace();
      });
    }
    if (DEFAULT_OPEN_IMAGE) {
      createImageElement(DEFAULT_OPEN_IMAGE, img => {
        openImage = img;
        updateFace();
      });
    }

    function bindFileInput(inputId, onReady) {
      document.getElementById(inputId).addEventListener("change", e => {
        const file = e.target.files[0];
        if (!file) return;

        const url = URL.createObjectURL(file);
        createImageElement(url, img => {
          onReady(img);
          URL.revokeObjectURL(url);
        });
      });
    }

    bindFileInput("closedFile", img => {
      closedImage = img;
      updateFace();
    });

    bindFileInput("openFile", img => {
      openImage = img;
      updateFace();
    });

    function updateFace() {
      if (closedImage && openImage) {
        const targetImg = isTalking ? openImage : closedImage;
        if (face.firstChild !== targetImg) {
          face.innerHTML = "";
          face.appendChild(targetImg);
        }
      } else {
        face.textContent = isTalking ? "😮" : "😐";
      }
    }

    threshold.addEventListener("input", () => {
      thresholdValue.textContent = threshold.value;
    });

    async function startMic() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 1024;

        microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);

        statusEl.textContent = "音声検知中";
        detectSound();
      } catch (error) {
        statusEl.textContent = "マイクを使用できません: " + error.message;
      }
    }

    function detectSound() {
      if (!analyser) return;

      const data = new Uint8Array(analyser.fftSize);
      analyser.getByteTimeDomainData(data);

      let sum = 0;
      for (let i = 0; i < data.length; i++) {
        const value = (data[i] - 128) / 128;
        sum += value * value;
      }

      const rms = Math.sqrt(sum / data.length);
      const volume = rms * 100;

      bar.style.width = Math.min(volume * 3, 100) + "%";

      const limit = Number(threshold.value);
      if (volume > limit) {
        isMicTalking = true;
        lastSoundTime = performance.now();
      } else if (performance.now() - lastSoundTime > 180) {
        isMicTalking = false;
      }

      refreshMouthState();
      animationId = requestAnimationFrame(detectSound);
    }

    function stopMic() {
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }

      analyser = null;
      microphone = null;
      isMicTalking = false;
      bar.style.width = "0%";
      refreshMouthState();
    }

    document.getElementById("startMicBtn").addEventListener("click", startMic);
    document.getElementById("stopMicBtn").addEventListener("click", stopMic);
  </script>
</body>
</html>
