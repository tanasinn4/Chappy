<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>音声プレイヤー＆口パク連動</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    #screen {
      position: fixed;
      inset: 0;
      background: #000 url("background.jpg") center center / contain no-repeat;
    }

    /* キャラクター表示エリア（背景の上に重ねる） */
    #character {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 1;
    }

    #character img {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
    }

    .face {
      font-size: clamp(96px, 24vw, 180px);
      line-height: 1;
      transition: transform 0.08s;
    }

    /* 左・中央・右のタップ領域 */
    #left, #center, #right {
      position: absolute;
      top: 0;
      bottom: 0;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
    }
    #left { left: 0; width: 33.3333%; }
    #center { left: 33.3333%; width: 33.3334%; }
    #right { right: 0; width: 33.3333%; }

    /* 設定開閉ボタンとパネル */
    #toggleSettingsBtn {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 10;
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      background: rgba(32, 37, 43, 0.85);
      color: #9de5a5;
      font-size: 14px;
      cursor: pointer;
    }

    #settingsPanel {
      display: none;
      position: fixed;
      top: 54px;
      right: 12px;
      z-index: 10;
      width: min(340px, calc(100vw - 24px));
      max-height: calc(100vh - 70px);
      overflow-y: auto;
      padding: 16px;
      box-sizing: border-box;
      background: rgba(48, 56, 64, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    #settingsPanel.open {
      display: block;
    }

    #settingsPanel p {
      margin: 8px 0 4px;
      font-size: 14px;
    }

    #status {
      font-size: 15px;
      color: #9de5a5;
      margin: 8px 0;
    }

      width: 100%;
      height: 14px;
      margin: 8px 0 12px;
      background: #22282e;
