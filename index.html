<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>MP3＆長押し口パクプレイヤー</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    #screen {
      position: fixed;
      inset: 0;
      background: #000 url("background.jpg") center center / contain no-repeat;
    }

    #character {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }

    #character img {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
    }

    .face {
      font-size: 120px;
      line-height: 1;
      color: #fff;
    }

    /* 画面左1/3の操作領域 */
    #leftArea {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 33.3333%;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
    }

    /* Androidステータスバー被り回避のため下に配置 */
    #toggleSettingsBtn {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 48px);
      right: 14px;
      z-index: 30;
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      background: rgba(32, 37, 43, 0.92);
      color: #9de5a5;
      font-size: 14px;
      cursor: pointer;
    }

    #settingsPanel {
      display: none;
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 96px);
      right: 14px;
      z-index: 30;
      width: min(340px, calc(100vw - 28px));
      max-height: calc(100vh - env(safe-area-inset-top, 0px) - 116px);
      overflow-y: auto;
      padding: 16px;
      box-sizing: border-box;
      background: #303840;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    #settingsPanel.open {
      display: block;
    }

    #settingsPanel p {
      margin: 8px 0 4px;
      font-size: 14px;
    }

    #status {
      font-size: 15px;
      color: #9de5a5;
      margin: 8px 0;
    }

    input[type=range] {
      width: 100%;
      cursor: pointer;
    }

    .panel-btn {
      padding: 8px 14px;
      margin: 4px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      background: #65b875;
      color: #fff;
      cursor: pointer;
    }

    .panel-btn.sub {
      background: #475569;
    }

    hr {
      border: none;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      margin: 12px 0;
    }

    input[type=file] {
      width: 100%;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .guide {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.6;
      margin: 6px 0;
    }
  </style>
</head>
<body>
  <main id="screen" aria-label="口パクプレイヤー">
    <div id="leftArea"></div>
  </main>

  <div id="character">
    <div class="face" id="face">😐</div>
  </div>

  <button type="button" id="toggleSettingsBtn">設定</button>

  <aside id="settingsPanel" aria-label="表示・操作設定">
    <div id="status">待機中</div>
    <div class="guide">
      【左1/3エリア】<br>
      上スワイプ：次の音 ／ 下スワイプ：前の音<br>
      タップ：再生・停止 ／ 長押し：口パク
    </div>

    <div>
      <button type="button" class="panel-btn sub" id="fullscreenBtn">全画面切替</button>
    </div>

    <hr>

    <p>音量の反応閾値</p>
    <input type="range" id="threshold" min="1" max="30" value="8">
    <p id="thresholdValue">8</p>

    <hr>

    <p>口を閉じた画像</p>
    <input type="file" id="closedFile" accept="image/*">

    <p>口を開いた画像</p>
    <input type="file" id="openFile" accept="image/*">
  </aside>
