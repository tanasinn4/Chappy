<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>MP3＆長押し口パクプレイヤー</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #screen {
      position: fixed;
      inset: 0;
      background: #000 url("background.jpg") center center / contain no-repeat;
    }

    #character {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }

    #character img {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
    }

    .face {
      font-size: 120px;
      line-height: 1;
      color: #fff;
    }

    /* 画面全体のジェスチャー受付領域 */
    #touchArea {
      position: fixed;
      inset: 0;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
    }

    /* Androidステータスバー被り回避のため下に配置 */
    #toggleSettingsBtn {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 48px);
      right: 14px;
      z-index: 20;
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      background: rgba(32, 37, 43, 0.92);
      color: #9de5a5;
      font-size: 14px;
      cursor: pointer;
    }

    #settingsPanel {
      display: none;
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 96px);
      right: 14px;
      z-index: 20;
      width: min(340px, calc(100vw - 28px));
      max-height: calc(100vh - env(safe-area-inset-top, 0px) - 116px);
      overflow-y: auto;
      padding: 16px;
      box-sizing: border-box;
      background: #303840;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      touch-action: auto;
    }

    #settingsPanel.open {
      display: block;
    }

    #settingsPanel p {
      margin: 8px 0 4px;
      font-size: 14px;
    }

    #status {
      font-size: 15px;
      color: #9de5a5;
      margin: 8px 0;
    }

    input[type=range] {
      width: 100%;
      cursor: pointer;
    }

    .panel-btn {
      padding: 8px 14px;
      margin: 4px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      background: #65b875;
      color: #fff;
      cursor: pointer;
    }

    .panel-btn.sub {
      background: #475569;
    }

    hr {
      border: none;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      margin: 12px 0;
    }

    input[type=file] {
      width: 100%;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .guide {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.6;
      margin: 6px 0;
    }
  </style>
</head>
<body>
  <main id="screen" aria-label="口パクプレイヤー">
    <div id="touchArea"></div>
  </main>

  <div id="character">
    <div class="face" id="face">😐</div>
  </div>

  <button type="button" id="toggleSettingsBtn">設定</button>

  <aside id="settingsPanel" aria-label="表示・操作設定">
    <div id="status">待機中</div>
    <div class="guide">
      上スワイプ：次の音 ／ 下スワイプ：前の音<br>
      タップ：再生・停止 ／ 長押し：口パク
    </div>

    <div>
      <button type="button" class="panel-btn sub" id="fullscreenBtn">全画面切替</button>
    </div>

    <hr>

    <p>音量の反応閾値</p>
    <input type="range" id="threshold" min="1" max="30" value="8">
    <p id="thresholdValue">8</p>

    <hr>

    <p>口を閉じた画像</p>
    <input type="file" id="closedFile" accept="image/*">

    <p>口を開いた画像</p>
    <input type="file" id="openFile" accept="image/*">
  </aside>

  <script>
    // ==========================================
    // 1. MP3音声ファイル設定（audio フォルダに配置）
    // ==========================================
    const speeches = [
      "audio/01_opening.mp3",
      "audio/02_kanpai.mp3",
      "audio/03_toast.mp3"
    ];

    // 初期画像パス（使わない場合は null のままでOK）
    const DEFAULT_CLOSED_IMAGE = null; // 例: "images/closed.png"
    const DEFAULT_OPEN_IMAGE = null;   // 例: "images/open.png"

    // 口パクの開閉周期（ミリ秒）
    const MOUTH_INTERVAL_MS = 140;

    // ジェスチャー判定のしきい値
    const SWIPE_THRESHOLD_PX = 45;
    const LONG_PRESS_DELAY_MS = 220;

    let current = 0;
    const player = new Audio();
    player.preload = "auto";
    let wakeLock = null;

    let isMp3Playing = false;
    let isLongPressing = false;
    let mouthOpen = false;
    let mouthTimer = null;

    let closedImage = null;
    let openImage = null;

    const face = document.getElementById("face");
    const statusEl = document.getElementById("status");
    const touchArea = document.getElementById("touchArea");
    const threshold = document.getElementById("threshold");
    const thresholdValue = document.getElementById("thresholdValue");
    const settingsPanel = document.getElementById("settingsPanel");

    function updateFace() {
      const shouldOpen = (isMp3Playing || isLongPressing) && mouthOpen;
      if (closedImage && openImage) {
        const targetImg = shouldOpen ? openImage : closedImage;
        if (face.firstChild !== targetImg) {
          face.innerHTML = "";
          face.appendChild(targetImg);
        }
      } else {
        face.textContent = shouldOpen ? "😮" : "😐";
      }
    }

    function updateStatus() {
      if (isLongPressing && isMp3Playing) {
        statusEl.textContent = "長押し口パク + MP3再生中";
      } else if (isLongPressing) {
        statusEl.textContent = "長押し口パク中";
      } else if (isMp3Playing) {
        statusEl.textContent = `MP3再生中 (${current + 1}/${speeches.length})`;
      } else {
        statusEl.textContent = "待機中";
      }
    }

    function syncMouthLoop() {
      const active = isMp3Playing || isLongPressing;
      if (active) {
        if (!mouthTimer) {
          mouthOpen = true;
          updateFace();
          mouthTimer = setInterval(() => {
            if (!(isMp3Playing || isLongPressing)) {
              clearInterval(mouthTimer);
              mouthTimer = null;
              mouthOpen = false;
              updateFace();
              return;
            }
            mouthOpen = !mouthOpen;
            updateFace();
          }, MOUTH_INTERVAL_MS);
        }
      } else {
        if (mouthTimer) {
          clearInterval(mouthTimer);
          mouthTimer = null;
        }
        mouthOpen = false;
        updateFace();
      }
      updateStatus();
    }

    // ==========================================
    // 2. MP3再生・スリープ防止
    // ==========================================
    async function requestWakeLock() {
      try {
        if ("wakeLock" in navigator && !wakeLock) {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeLock.addEventListener("release", () => { wakeLock = null; });
        }
      } catch (_) {}
    }

    function loadAndPlay(index) {
      if (!speeches.length) return;
      current = Math.max(0, Math.min(index, speeches.length - 1));
      player.pause();
      player.src = speeches[current];
      player.currentTime = 0;
      player.play().catch(() => {});
      requestWakeLock();
    }

    function togglePlayback() {
      if (!speeches.length) return;
      if (!player.src) {
        loadAndPlay(current);
      } else if (player.paused) {
        player.play().catch(() => {});
        requestWakeLock();
      } else {
        player.pause();
      }
    }

    player.addEventListener("playing", () => {
      isMp3Playing = true;
      syncMouthLoop();
    });
    player.addEventListener("pause", () => {
      isMp3Playing = false;
      syncMouthLoop();
    });
    player.addEventListener("ended", () => {
      isMp3Playing = false;
      syncMouthLoop();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && isMp3Playing) {
        requestWakeLock();
      }
    });

    // ==========================================
    // 3. スワイプ・タップ・長押し判定（Pointer Events）
    // ==========================================
    let activePointerId = null;
    let startX = 0;
    let startY = 0;
    let movedBeyondTap = false;
    let longPressTimer = null;

    function clearGestureState() {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
      if (isLongPressing) {
        isLongPressing = false;
        syncMouthLoop();
      }
      activePointerId = null;
      movedBeyondTap = false;
    }

    touchArea.addEventListener("pointerdown", e => {
      if (activePointerId !== null) return;
      activePointerId = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      movedBeyondTap = false;

      longPressTimer = setTimeout(() => {
        longPressTimer = null;
        if (activePointerId !== null && !movedBeyondTap) {
          isLongPressing = true;
          syncMouthLoop();
        }
      }, LONG_PRESS_DELAY_MS);
    });

    touchArea.addEventListener("pointermove", e => {
      if (e.pointerId !== activePointerId) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      if (Math.hypot(dx, dy) > 14) {
        movedBeyondTap = true;
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
      }
    });

    touchArea.addEventListener("pointerup", e => {
      if (e.pointerId !== activePointerId) return;
      const dy = e.clientY - startY;
      const wasLongPressing = isLongPressing;
      const wasMoved = movedBeyondTap;

      clearGestureState();

      // 長押ししていた場合は離して口を閉じるだけ（再生/停止は発動させない）
      if (wasLongPressing) return;

      // 上スワイプ（dy がマイナス方向）→ 次の音
      if (dy <= -SWIPE_THRESHOLD_PX) {
        if (current < speeches.length - 1) loadAndPlay(current + 1);
        return;
      }

      // 下スワイプ（dy がプラス方向）→ 前の音
      if (dy >= SWIPE_THRESHOLD_PX) {
        if (current > 0) loadAndPlay(current - 1);
        return;
      }

      // 移動が小さければタップ → 再生／停止
      if (!wasMoved) {
        togglePlayback();
      }
    });

    touchArea.addEventListener("pointercancel", e => {
      if (e.pointerId === activePointerId) {
        clearGestureState();
      }
    });

    window
